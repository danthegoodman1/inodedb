[package]
name = "inodedb-server"
description = "InodeDB's gRPC server: the writer over a storage backend."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "inodedb"
path = "src/main.rs"

[features]
rocksdb = ["dep:inodedb-storage-rocksdb"]
fdb = ["dep:inodedb-storage-fdb", "inodedb-storage-fdb/fdb"]

[dependencies]
aes.workspace = true
getrandom.workspace = true
inodedb-core.workspace = true
inodedb-proto.workspace = true
inodedb-storage.workspace = true
inodedb-storage-fdb = { workspace = true, optional = true }
inodedb-storage-lionturtle.workspace = true
inodedb-storage-rocksdb = { workspace = true, optional = true }
inodedb-storage-sqlite.workspace = true
inodedb-transport.workspace = true
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1.52", default-features = false }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
