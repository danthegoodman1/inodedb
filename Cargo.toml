[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/client",
    "crates/core",
    "crates/proto",
    "crates/server",
    "crates/sim",
    "crates/storage",
    "crates/storage-conformance",
    "crates/storage-fdb",
    "crates/storage-lionturtle",
    "crates/storage-rocksdb",
    "crates/storage-sqlite",
    "crates/transport",
    "tests",
]
# RocksDB links a C++ library; `--workspace` builds it, a plain build skips it.
default-members = [
    "crates/cli",
    "crates/client",
    "crates/core",
    "crates/proto",
    "crates/server",
    "crates/sim",
    "crates/storage",
    "crates/storage-conformance",
    "crates/storage-lionturtle",
    "crates/storage-sqlite",
    "tests",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/danthegoodman1/inodedb"
readme = "README.md"
# Only the client and the three crates it builds on publish (RELEASING.md).
publish = false

[workspace.dependencies]
inodedb-client = { path = "crates/client", version = "0.1.1" }
inodedb-core = { path = "crates/core", version = "0.1.1" }
inodedb-proto = { path = "crates/proto", version = "0.1.1" }
inodedb-server = { path = "crates/server" }
inodedb-storage = { path = "crates/storage" }
inodedb-storage-lionturtle = { path = "crates/storage-lionturtle" }
inodedb-storage-rocksdb = { path = "crates/storage-rocksdb" }
inodedb-storage-conformance = { path = "crates/storage-conformance" }
inodedb-storage-fdb = { path = "crates/storage-fdb" }
inodedb-storage-sqlite = { path = "crates/storage-sqlite" }
inodedb-transport = { path = "crates/transport", version = "0.1.1" }
aes = "0.9.0"
bytes = "1.10.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
fuser = "0.18.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
h2 = "0.4.13"
http = "1.4.0"
http-body = "1.0.1"
prost = "0.14.4"
lionturtle = "0.6.0"
rocksdb = { version = "0.25.0", default-features = false, features = ["lz4"] }
rusqlite = "0.41.1"
serde = "1.0.229"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-stream = "0.1.19"
toml = "1.1.8"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower-service = "0.3.3"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[profile.release]
debug = "line-tables-only"

# RocksDB's C++ debug info takes 1.6 GB per build and swells every binary that
# links it, which fills a CI runner's disk.
[profile.dev.package.librocksdb-sys]
debug = false
