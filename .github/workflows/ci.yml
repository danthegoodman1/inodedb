name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A cold build on top of a restored cache can fill the image's free disk.
      - name: Free disk from SDKs this job leaves unused
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # RocksDB's bindings build against libclang.
      - run: sudo apt-get install -y protobuf-compiler libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features rocksdb -- -D warnings
      # Memory, SQLite and RocksDB, for storage and API conformance alike.
      - run: cargo test --workspace --features rocksdb
      # Cargo reads the repository's configuration only from inside it, so a
      # build started elsewhere lacks the flag that selects fdatasync.
      - name: A build from outside the repository is refused
        run: |
          cd "$RUNNER_TEMP"
          if cargo check -p inodedb-storage-sqlite --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" 2> refused.log; then
            echo "the build went through without the fdatasync flag"
            exit 1
          fi
          grep -q "would compile SQLite to sync with fsync" refused.log
          cargo check -p inodedb-storage-sqlite --config "$GITHUB_WORKSPACE/.cargo/config.toml" --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"

  foundationdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Storage, API and standby conformance against a FoundationDB server.
      - run: scripts/fdb
      # `idb mount` through the kernel's FUSE.
      - run: scripts/fdb cargo test -p inodedb-cli --features mount --test mount

  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y protobuf-compiler
      - name: Simulate with the commit hash as the seed
        run: cargo run --release -p inodedb-sim -- ${{ github.sha }}
      - name: Sweep 2,000 seeds from the commit hash
        run: cargo run --release -p inodedb-sim -- ${{ github.sha }} --seeds 2000
