name: Release

# Publishes inodedb-core, inodedb-proto, inodedb-transport and inodedb-client
# to crates.io over Trusted Publishing (OIDC, with no long-lived token secret).
# Runs when a v* tag is pushed, as a reusable workflow called from bump.yml
# (tags pushed with a workflow's GITHUB_TOKEN start no workflows, so the bump
# path calls this directly), or manually through workflow_dispatch to finish a
# tag whose publish never landed.
#
# Each crate publishes only if its version is missing from crates.io, which
# makes a rerun safe and serves the first publish as well.
#
# crates.io setup (RELEASING.md): each crate's Settings -> Trusted Publishing
# lists GitHub danthegoodman1/inodedb with release.yml and with bump.yml (the
# OIDC claim names the top-level workflow).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Git ref to release (the tag created by the bump workflow)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Existing v* tag to release (crates already on crates.io at its version are skipped)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CRATES: inodedb-core inodedb-proto inodedb-transport inodedb-client

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # crates/proto's test checks its generated code with protoc.
      - run: sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@1.98.0
      # workflow_call children inherit the caller's event context, so a
      # push-to-main auto-release also reports event_name == 'push'; only a
      # real tag push (ref_type == 'tag') has a tag name to verify against.
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Find the crates crates.io lacks at this version
        id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          packages=""
          for crate in $CRATES; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -A "inodedb-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$status" = "200" ]; then
              echo "${crate} ${version} is already on crates.io"
            else
              packages="$packages -p $crate"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.packages != ''
      # Cargo publishes the crates in dependency order.
      - name: Publish
        if: steps.check.outputs.packages != ''
        run: cargo publish ${{ steps.check.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # For a manually pushed tag (the bump path already created the release),
      # make sure a GitHub release exists for it.
      - name: Ensure a GitHub release exists for the tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
