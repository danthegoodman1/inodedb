name: Release

# Publishes inodedb-core, inodedb-proto, inodedb-transport and inodedb-client
# to crates.io over Trusted Publishing (OIDC, with no long-lived token secret).
# Runs when a v* tag is pushed, as bump.yml does with its deploy key, or
# manually through workflow_dispatch to finish a tag whose publish never
# landed.
#
# Each crate publishes only if its version is missing from crates.io, which
# makes a rerun safe and serves the first publish as well.
#
# crates.io setup (RELEASING.md): each crate's Settings -> Trusted Publishing
# lists GitHub danthegoodman1/inodedb with release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing v* tag to release (crates already on crates.io at its version are skipped)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CRATES: inodedb-core inodedb-proto inodedb-transport inodedb-client

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # crates/proto's test checks its generated code with protoc.
      - run: sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      # The default members: the published crates, the server, and the API
      # tests on memory, SQLite and lionturtle. CI covers RocksDB, whose
      # bindings need libclang, and FoundationDB.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Find the crates crates.io lacks at this version
        id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          packages=""
          for crate in $CRATES; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -A "inodedb-release-workflow" "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$status" = "200" ]; then
              echo "${crate} ${version} is already on crates.io"
            else
              packages="$packages -p $crate"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.packages != ''
      # Cargo publishes the crates in dependency order.
      - name: Publish
        if: steps.check.outputs.packages != ''
        run: cargo publish ${{ steps.check.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Ensure a GitHub release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes
