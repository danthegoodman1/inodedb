# A one-process FoundationDB cluster on the memory engine, for trying the
# example. A production cluster runs under the FoundationDB operator and
# publishes its cluster file the same way, as a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fdb-cluster
data:
  fdb.cluster: "inodedb:example@fdb-0.fdb.default.svc.cluster.local:4500"
---
apiVersion: v1
kind: Service
metadata:
  name: fdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: fdb
  ports:
    - name: fdb
      port: 4500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fdb
spec:
  serviceName: fdb
  replicas: 1
  selector:
    matchLabels:
      app: fdb
  template:
    metadata:
      labels:
        app: fdb
    spec:
      containers:
        - name: fdb
          image: inodedb:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          # FoundationDB rewrites its cluster file, so it runs from a copy.
          args:
            - |
              mkdir -p /var/fdb/data /var/fdb/logs
              cp /etc/fdb/fdb.cluster /var/fdb/fdb.cluster
              (sleep 3; fdbcli -C /var/fdb/fdb.cluster --exec "configure new single memory" --timeout 60) &
              exec fdbserver -C /var/fdb/fdb.cluster --public-address "$POD_IP:4500" \
                --listen-address 0.0.0.0:4500 --datadir /var/fdb/data --logdir /var/fdb/logs
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 4500
          volumeMounts:
            - name: cluster
              mountPath: /etc/fdb
      volumes:
        - name: cluster
          configMap:
            name: fdb-cluster
